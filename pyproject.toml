[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rusterm"
version = "0.1.0"
description = "EquityLab: research snapshot terminal — ядро и CLI"
requires-python = ">=3.12"
authors = [{name = "EquityLab"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "zstandard>=0.22"]
# ТЗ-22 J8: библиотеки форматов ручного импорта — опциональны; их
# отсутствие даёт format_unsupported значением, а не поломку (ADR-0011 ①)
documents = ["pypdf>=4", "python-docx>=1", "openpyxl>=3"]
# TASK-C1 (ADR-0004/ADR-0023): окно десктопа — необязательная
# зависимость; ядро, CLI и TUI собираются и тестируются без Qt
desktop = ["PySide6>=6.6", "pyqtgraph>=0.13"]

[project.scripts]
rusterm = "rusterm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rusterm*"]
exclude = ["tests*", "fixtures*", "agent*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ТЗ-29 A2: default-прогон не собирает ни один тест, способный дойти
# до сети или модели; живой путь — только явным -m live.
# ТЗ-61 F3: объёмный тест окна (500 бумаг, тайминги) — тоже мимо
# обычного набора, явный -m volume.
addopts = '-q --strict-markers -m "not live and not volume and not firsthour"'
markers = [
    "integration: тесты с реальными источниками (требуют сеть)",
    "live: живой сетевой/модельный вызов — запускается только явно (-m live), default-прогон его не собирает (TASK-29 A2)",
    "volume: объёмный прогон окна на 500 бумаг (ТЗ-61 F3) — только явно (-m volume), обычный набор его не гоняет",
    "firsthour: первый час пользователя целиком (ТЗ-65 K4) — только явно (-m firsthour), обычный набор его не гоняет",
]
